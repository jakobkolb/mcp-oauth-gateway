{{- $base := .Values.global.baseDomain -}}
{{- $issuer := .Values.global.clusterIssuer | default "letsencrypt-prod" -}}
{{- $authServerUrl := .Values.global.authServerUrl -}}
{{- $rn := .Release.Name -}}
{{- $wkName := printf "%s-well-known" $rn -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $wkName }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  default.conf: |
{{- include "api-gateway.wellKnownConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $wkName }}
  labels:
    app.kubernetes.io/name: {{ $wkName }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $wkName }}
  template:
    metadata:
      annotations:
        # OpenResty reads its config once at startup and a mounted ConfigMap
        # update does not reload it, so tie the pod to the config's content:
        # any change to it rolls the pod and the new metadata actually serves.
        checksum/config: {{ include "api-gateway.wellKnownConfig" . | sha256sum }}
      labels:
        app: {{ $wkName }}
    spec:
      containers:
        - name: nginx
          image: openresty/openresty:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /.well-known/oauth-protected-resource
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ $wkName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $wkName }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app: {{ $wkName }}
  ports:
    - port: 80
      targetPort: 80
---
{{/* /.well-known ingress per MCP hostname — no auth annotation.
     Paths are enumerated explicitly (Exact) so cert-manager's dynamically-created
     /.well-known/acme-challenge/* solver ingress is never intercepted. */}}
{{- range .Values.mcpEndpoints }}
{{- $host := printf "%s.%s" .subdomain $base }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $rn }}-{{ .subdomain }}-well-known
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [{{ $host }}]
      secretName: {{ $rn }}-{{ .subdomain }}-tls
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /.well-known/oauth-authorization-server
            pathType: Exact
            backend:
              service:
                name: {{ $wkName }}
                port:
                  number: 80
          - path: /.well-known/oauth-protected-resource
            pathType: Exact
            backend:
              service:
                name: {{ $wkName }}
                port:
                  number: 80
---
{{- end }}
{{/* auth host ingress: routes specific /.well-known paths and /auth to this service.
     Paths are enumerated explicitly (Exact) so cert-manager's /.well-known/acme-challenge/*
     solver ingress is never intercepted by this rule.
     /auth and /register use Prefix/Exact as before — scope injection applied before Dex.
     All other auth.<baseDomain> paths (/token, /keys, /callback) still go to Dex. */}}
{{- $authHost := printf "auth.%s" $base }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $rn }}-auth-well-known
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [{{ $authHost }}]
      secretName: {{ $rn }}-dex-tls
  rules:
    - host: {{ $authHost }}
      http:
        paths:
          - path: /.well-known/oauth-authorization-server
            pathType: Exact
            backend:
              service:
                name: {{ $wkName }}
                port:
                  number: 80
          - path: /.well-known/openid-configuration
            pathType: Exact
            backend:
              service:
                name: {{ $wkName }}
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ $wkName }}
                port:
                  number: 80
          - path: /register
            pathType: Exact
            backend:
              service:
                name: {{ $wkName }}
                port:
                  number: 80
